version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabib_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tabib_network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_DATABASE=tabib_medical_platform
      - DB_USERNAME=tabib_user
      - DB_PASSWORD=tabib_password
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis

  db:
    image: mysql:8.0
    container_name: tabib_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tabib_medical_platform
      MYSQL_USER: tabib_user
      MYSQL_PASSWORD: tabib_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - tabib_network

  redis:
    image: redis:7-alpine
    container_name: tabib_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tabib_network

  nginx:
    image: nginx:alpine
    container_name: tabib_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - tabib_network

  mailhog:
    image: mailhog/mailhog
    container_name: tabib_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tabib_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tabib_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: tabib_user
      PMA_PASSWORD: tabib_password
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - tabib_network

networks:
  tabib_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
