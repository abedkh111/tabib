<VirtualHost *:80>
    ServerName tabib.local
    ServerAlias www.tabib.local
    DocumentRoot /home/abedkh/Documents/tabib/public

    <Directory /home/abedkh/Documents/tabib/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Laravel specific settings
    <Directory /home/abedkh/Documents/tabib>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # Allow access to storage symlink
    <Directory /home/abedkh/Documents/tabib/public/storage>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/tabib_error.log
    CustomLog ${APACHE_LOG_DIR}/tabib_access.log combined

    # PHP settings
    php_value upload_max_filesize 10M
    php_value post_max_size 10M
    php_value memory_limit 256M
    php_value max_execution_time 300
</VirtualHost>

